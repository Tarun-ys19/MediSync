<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="primaryGrad" x1="64" y1="64" x2="448" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#f29e0d" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Accent Glow Gradient -->
    <linearGradient id="pulseGrad" x1="120" y1="256" x2="392" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="0" y="0" width="512" height="512" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#f29e0d" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Outer Rounded Squircle Container -->
  <rect x="56" y="56" width="400" height="400" rx="100" fill="url(#primaryGrad)" filter="url(#shadow)" />

  <!-- Inner Soft Accent Ring -->
  <rect x="68" y="68" width="376" height="376" rx="88" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="4" />

  <!-- Medical Cross / Shield Accent Base -->
  <path d="M256 140 V372 M140 256 H372" stroke="rgba(255, 255, 255, 0.22)" stroke-width="32" stroke-linecap="round" />

  <!-- Continuous Sync Arrows (Health + Sync concept) -->
  <!-- Top-Right Sync Arc -->
  <path d="M 330 160 A 136 136 0 0 1 392 256" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-dasharray="16 8" />
  <!-- Bottom-Left Sync Arc -->
  <path d="M 182 352 A 136 136 0 0 1 120 256" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-dasharray="16 8" />

  <!-- Dynamic ECG / Heartbeat Rhythm Wave (The Core Sync Element) -->
  <path 
    d="M 130 256 
       H 190 
       L 216 200 
       L 248 315 
       L 282 175 
       L 310 295 
       L 330 256 
       H 382" 
    fill="none" 
    stroke="url(#pulseGrad)" 
    stroke-width="22" 
    stroke-linecap="round" 
    stroke-linejoin="round" 
  />

  <!-- Vital Rhythm Pulse Nodes -->
  <circle cx="282" cy="175" r="9" fill="#ffffff" />
  <circle cx="248" cy="315" r="8" fill="#ffffff" />
</svg>

